      <button class="flip-card" aria-expanded="false">

  <!-- 2 -->
      <button class="flip-card" aria-expanded="false">

  <!-- 5 -->
     <button class="flip-card" aria-expanded="false">

       <div class="flip-face back">小型ペットはテラス席にて同伴可能です。</div>
